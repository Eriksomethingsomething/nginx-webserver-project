
# Konfigurasjonsfil som bestemmer hvordan Nginx serverer nettsiden.

server {
    listen 80;
    # Nginx lytter på port 80 inne i containeren.

    server_name localhost;
    # Angir servernavnet for nettsiden.

    root /usr/share/nginx/html;
    # Angir mappen der nettsidefilene ligger.

    index index.html;
    # Bruker index.html som standard startside.

    error_page 404 /404.html;
    # Viser en egen 404-side når en side ikke finnes.

    location = /404.html {
        internal;
        # Gjør at 404-siden bare kan vises internt av Nginx,
        # for eksempel ved en 404-feil.
    }
}

# Hva hjelper Nginx-konfigurasjonen med?
# Den bestemmer hvordan Nginx håndterer forespørsler,
# hvor nettsidefilene ligger, og hvilken feilmelding som vises.
