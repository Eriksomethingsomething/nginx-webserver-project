services:
  website:
    build: .

    ports:
      - "8082:80"

    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3